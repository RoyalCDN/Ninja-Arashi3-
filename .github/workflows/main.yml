
name: Ninja Arashi 3 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Project
        shell: bash
        run: |
          echo "Repository files:"
          ls -la
          echo "Searching for project files:"
          find . -maxdepth 4 \
            \( -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \
            -o -name project.godot \
            -o -name gradle-wrapper.properties \) \
            -not -path './.git/*'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          adb version
          sdkmanager --version

      - name: Detect Android Project
        id: detect
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "project_type=gradle" >> "$GITHUB_OUTPUT"
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "./android/gradlew" ]; then
            echo "project_type=gradle" >> "$GITHUB_OUTPUT"
            echo "project_dir=android" >> "$GITHUB_OUTPUT"
          elif [ -f "./app/build.gradle" ] || \
               [ -f "./app/build.gradle.kts" ]; then
            echo "project_type=gradle" >> "$GITHUB_OUTPUT"
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "./project.godot" ]; then
            echo "project_type=godot" >> "$GITHUB_OUTPUT"
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: No supported game project found."
            echo "A YAML prompt alone cannot be built into an APK."
            exit 1
          fi

      - name: Set up Gradle
        if: steps.detect.outputs.project_type == 'gradle'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        if: steps.detect.outputs.project_type == 'gradle'
        working-directory: ${{ steps.detect.outputs.project_dir }}
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: Gradle Wrapper is missing."
            echo "Add gradlew and gradle/wrapper files to the repository."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        if: steps.detect.outputs.project_type == 'gradle'
        shell: bash
        run: |
          mkdir -p release

          find "${{ steps.detect.outputs.project_dir }}" \
            -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -not -path '*/build/intermediates/*' \
            -exec cp {} release/ \;

          if ! ls release/*.apk >/dev/null 2>&1; then
            echo "ERROR: APK file was not generated."
            exit 1
          fi

          ls -lh release/

      - name: Upload APK Artifact
        if: steps.detect.outputs.project_type == 'gradle'
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Arashi3-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 7
