

name: Build Ninja Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Project Files
        run: |
          echo "Checking repository structure..."
          ls -la
          find . -maxdepth 3 \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'gradlew' \
            -o -name 'project.godot' \) \
            -not -path './.git/*'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          adb version
          sdkmanager --version

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "type=gradle" >> "$GITHUB_OUTPUT"
            echo "root=." >> "$GITHUB_OUTPUT"
          elif [ -f "./app/build.gradle" ] || \
               [ -f "./app/build.gradle.kts" ]; then
            echo "type=gradle" >> "$GITHUB_OUTPUT"
            echo "root=." >> "$GITHUB_OUTPUT"
          elif [ -f "./android/gradlew" ]; then
            echo "type=gradle" >> "$GITHUB_OUTPUT"
            echo "root=android" >> "$GITHUB_OUTPUT"
          elif [ -f "./project.godot" ]; then
            echo "type=godot" >> "$GITHUB_OUTPUT"
            echo "root=." >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Android Gradle or Godot project not found."
            echo "This workflow cannot convert a YAML prompt into an APK."
            exit 1
          fi

      - name: Set up Gradle
        if: steps.project.outputs.type == 'gradle'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        if: steps.project.outputs.type == 'gradle'
        shell: bash
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "ERROR: gradlew is missing."
            echo "Add the Gradle Wrapper to your Android project."
            exit 1
          fi

      - name: Locate APK
        if: steps.project.outputs.type == 'gradle'
        id: apk
        shell: bash
        run: |
          mkdir -p release
          find "${{ steps.project.outputs.root }}" \
            -type f -path '*/build/outputs/apk/*/*.apk' \
            -not -path '*/build/intermediates/*' \
            -exec cp {} release/ \;

          if ! ls release/*.apk >/dev/null 2>&1; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          ls -lh release/

      - name: Upload APK Artifact
        if: steps.project.outputs.type == 'gradle'
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-Android-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 7
