
project:
  name: Shadow_Ninja_Online
  type: 2D_Action_Platformer
  platform: Android
  engine: Godot
  language: GDScript

game:
  orientation: landscape
  art_style: dark_silhouette
  graphics:
    quality: [low, medium, high]
    target_fps: 60

  player:
    account:
      registration: email
      login: email_password
      guest_mode: true
      cloud_save: true

    abilities:
      - run
      - jump
      - double_jump
      - dash
      - wall_slide
      - melee_attack
      - projectile_attack

  levels:
    - Shadow_Forest
    - Forgotten_Temple
    - Dark_Fortress

  features:
    - touch_controls
    - enemies_and_bosses
    - traps_and_platforming
    - quests
    - character_upgrades
    - inventory
    - sound_effects
    - background_music
    - save_progress

online:
  enabled: true
  authentication: backend_required
  multiplayer: real_time
  matchmaking: rooms
  chat: disabled
  leaderboards: true
  anti_cheat: server_validation
  reconnect: true

backend:
  authentication: secure_account_service
  database: player_profiles
  save_data:
    - player_level
    - unlocked_levels
    - coins
    - upgrades
    - achievements

audio:
  music: true
  sound_effects: true
  volume_control: true

build:
  android_apk: true
  android_aab: true
  export_templates_required: true

requirements:
  - generate_complete_project_files
  - include_all_scripts_and_scenes
  - include_placeholder_art_and_audio
  - include_database_schema
  - include_backend_setup
  - include_android_build_instructions
  - include_testing_instructions
  - no_fake_online_connection
  - no_missing_scripts
